<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Gakumas ADV Viewer</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden;
               font-family: "Yu Gothic UI", "Meiryo", sans-serif; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }
  #bg2d { position: absolute; inset: 0; overflow: hidden; }
  #bg2d img { position: absolute; transform-origin: center center; }
  #ui { position: absolute; inset: 0; pointer-events: none; }
  #msg {
    position: absolute; left: 8%; right: 8%; bottom: 6%; height: 22%;
    display: none;
  }
  #msg .window {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(250,250,252,.92), rgba(232,238,248,.95));
    border: 2px solid rgba(90,110,150,.85); border-radius: 18px;
    box-shadow: 0 6px 24px rgba(0,0,0,.35);
  }
  #msg .name {
    position: absolute; left: 4%; top: -1.6em; padding: .1em 1.1em;
    color: #fff; font-size: 1.5vw; letter-spacing: .08em;
    background: linear-gradient(180deg,#5b7bb5,#33507e);
    border-radius: 10px 10px 0 0;
  }
  #msg .text {
    position: absolute; inset: 8% 6% 8% 6%; color: #23324a;
    font-size: 1.9vw; line-height: 1.45; white-space: pre-wrap;
  }
  #hud {
    position: absolute; left: 8px; top: 8px; color: #9fb; font: 12px monospace;
    background: rgba(0,0,0,.45); padding: 6px 8px; border-radius: 6px;
    pointer-events: auto; max-width: 46vw; white-space: pre-wrap;
  }
  #hud input { width: 260px; }
</style>
</head>
<body>
<div id="app"></div>
<div id="bg2d"></div>
<div id="ui">
  <div id="msg"><div class="window"></div><div class="name"></div><div class="text"></div></div>
</div>
<div id="hud">
  <div id="status">loading…</div>
  <label>t <input id="seek" type="range" min="0" max="1000" value="0"></label>
  <button id="play">play/pause</button>
  <button id="orbit">orbit</button>
</div>
<script type="importmap">
{ "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/"
} }
</script>
<script type="module" src="./main.js"></script>
</body>
</html>
